services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - shared-network

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped

    env_file:
      - .env

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared-network

volumes:
  mysql_data:
    name: shared-mysql-data

  redis_data:
    name: shared-redis-data

networks:
  shared-network:
    name: shared-network

